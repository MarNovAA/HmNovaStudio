<style>
:root{--bg:#05070D;--ice:#4C8DFF;--tx:#E8ECF4;--mu:#9AA6BB;--ch:linear-gradient(180deg,#fff,#cfd6e3 48%,#8b95a8);--bd:rgba(76,141,255,.28)}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);font:16px/1.7 Manrope,system-ui,sans-serif;overflow-x:hidden;transition:opacity .2s}
html[lang=ar] body,html[lang=ar] h1,html[lang=ar] h2,html[lang=ar] h3,html[lang=ar] .dsp{font-family:Cairo,sans-serif;letter-spacing:0}
h1,h2,h3,.dsp{font-family:Unbounded,sans-serif;font-weight:700;line-height:1.12;letter-spacing:-.02em}
html[lang=ar] h1,html[lang=ar] h2,html[lang=ar] h3{font-weight:800;line-height:1.35}
a{color:inherit;text-decoration:none}
.gt{background:var(--ch);-webkit-background-clip:text;background-clip:text;color:transparent}
.mu{color:var(--mu)}

/* starfield: two drifting layers (transform only) */
.sf{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;background:radial-gradient(60% 40% at 85% 0,rgba(76,141,255,.16),transparent),radial-gradient(50% 35% at 0 100%,rgba(76,141,255,.1),transparent)}
.sf::before,.sf::after{content:"";position:absolute;left:0;right:0;top:0;height:calc(100% + 400px);will-change:transform}
.sf::before{background:radial-gradient(1px 1px at 40px 60px,#fff 50%,transparent),radial-gradient(1px 1px at 190px 150px,#cde 50%,transparent),radial-gradient(1.5px 1.5px at 260px 30px,#fff 50%,transparent),radial-gradient(1px 1px at 110px 240px,#9bf 50%,transparent);background-size:300px 300px;animation:d1 170s linear infinite;opacity:.7}
.sf::after{background:radial-gradient(1px 1px at 70px 90px,#fff 50%,transparent),radial-gradient(1.4px 1.4px at 300px 200px,#bcd 50%,transparent),radial-gradient(1px 1px at 180px 330px,#fff 50%,transparent);background-size:400px 400px;animation:d2 100s linear infinite;opacity:.9}
@keyframes d1{to{transform:translateY(-300px)}}@keyframes d2{to{transform:translateY(-400px)}}
/* header */
header{position:sticky;top:0;z-index:50;background:rgba(5,7,13,.85);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.06)}
.hd{max-width:1180px;margin:auto;padding:9px 16px;display:flex;align-items:center;gap:8px}
.logo{display:flex;align-items:center;gap:9px;margin-inline-end:auto}
.lg{width:48px;height:38px;filter:drop-shadow(0 0 5px rgba(76,141,255,.55))}
.wm{display:grid;line-height:1;font-family:Unbounded,sans-serif}.wm b{font-size:15px;letter-spacing:.1em}.wm small{font-size:8px;letter-spacing:.6em;color:var(--mu);margin-top:5px}
nav{display:none;position:absolute;top:100%;inset-inline:0;background:#080b14;padding:16px 20px;flex-direction:column;gap:14px;border-bottom:1px solid var(--bd)}
nav.open{display:flex}
.pill{background:transparent;color:var(--tx);border:1px solid var(--bd);border-radius:99px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}.pill option{background:#0a0f1c}
.hc{display:none;padding:9px 20px;font-size:14px}
@media(min-width:920px){nav{display:flex;position:static;flex-direction:row;background:none;padding:0;border:0;gap:26px;font-size:15px;margin-inline-end:8px}.bg,.only-m{display:none}.hc{display:inline-flex}}
/* buttons with shine sweep */
.b{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;padding:14px 28px;border-radius:99px;font:700 15px Manrope,Cairo,sans-serif;border:1px solid transparent;cursor:pointer;background:var(--ch);color:#05070D;box-shadow:0 0 30px -8px var(--ice);transition:transform .25s}
html[lang=ar] .b{font-family:Cairo}
.b::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.85) 50%,transparent 70%);transform:translateX(-130%);transition:transform .7s}
.b:hover{transform:translateY(-2px)}.b:hover::after{transform:translateX(130%)}
.b.g{background:transparent;color:var(--tx);border-color:var(--bd);box-shadow:none}
/* cards with cursor glow */
.c{position:relative;overflow:hidden;border:1px solid var(--bd);border-radius:20px;background:linear-gradient(160deg,rgba(255,255,255,.05),rgba(255,255,255,.01));padding:26px;display:flex;flex-direction:column;gap:10px}
.c::before{content:"";position:absolute;left:0;top:0;width:280px;height:280px;margin:-140px 0 0 -140px;background:radial-gradient(closest-side,rgba(76,141,255,.24),transparent);transform:translate(var(--x,0),var(--y,0));opacity:0;transition:opacity .3s;pointer-events:none}
.c:hover::before{opacity:1}
.c h3{font-size:19px}.c h4{font-size:13px;color:var(--mu);font-weight:600;margin-top:6px}
ul{padding-inline-start:18px}
.tag{align-self:flex-start;font-size:12px;border:1px solid var(--bd);border-radius:99px;padding:2px 12px;color:var(--ice)}
.hot{background:var(--ice);color:#fff;border-color:var(--ice)}
.pr b{font:700 26px Unbounded,Cairo}html[lang=ar] .pr b{font-family:Cairo}.pr small{color:var(--mu)}

h2{font-size:clamp(26px,4.6vw,46px);margin-bottom:14px;max-width:760px}
.lead{max-width:560px;margin-bottom:34px;color:var(--mu)}
/* hero */
.hw{position:relative;overflow:hidden}
.hero{position:relative;z-index:1;max-width:1180px;margin:auto;padding:52px 18px 200px;display:grid;gap:44px;align-items:center}

.hero h1{font-size:clamp(32px,6.2vw,66px);margin:16px 0 20px}
.hero .lead{font-size:18px;margin-bottom:28px}
.ey{color:var(--ice);font-weight:600;font-size:15px}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.sq{animation:up .8s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i)*.14s)}
@keyframes up{from{opacity:0;transform:translateY(26px)}}
.pl{position:absolute;left:50%;width:160vw;margin-left:-80vw;aspect-ratio:1;bottom:calc(-160vw + 130px);border-radius:50%;background:radial-gradient(circle at 50% 0,#10204a,#070b16 40%,#05070D 70%);box-shadow:0 -2px 0 rgba(195,218,255,.9),0 -16px 60px rgba(76,141,255,.5)}
.pl::before{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(1.5px 1.5px at 44% 1.2%,#ffb86b 50%,transparent),radial-gradient(1.5px 1.5px at 48% 1.9%,#ffc98a 50%,transparent),radial-gradient(1.5px 1.5px at 53% 1.1%,#ffb86b 50%,transparent),radial-gradient(1.5px 1.5px at 57% 2.1%,#ffc98a 50%,transparent),radial-gradient(1.5px 1.5px at 40% 2.4%,#ffb86b 50%,transparent)}
.pl::after{content:"";position:absolute;inset:-2px;border-radius:50%;box-shadow:0 -24px 100px rgba(130,175,255,.65);animation:pg 6s ease-in-out infinite alternate}
@keyframes pg{from{opacity:.3}to{opacity:1}}
/* CSS laptop with mini website */
.lp{animation:fl 7s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-9px)}}
.scr{position:relative;overflow:hidden;aspect-ratio:16/10;border:6px solid #1b2234;border-bottom-width:8px;border-radius:14px 14px 4px 4px;background:linear-gradient(160deg,#0d1730,#05070D);padding:5% 6%;box-shadow:0 0 70px -10px rgba(76,141,255,.6)}
.scr::before{content:"";position:absolute;inset-inline-end:-20%;bottom:-45%;width:75%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(76,141,255,.55),transparent 65%)}
.base{height:11px;margin:0 -5%;border-radius:0 0 16px 16px;background:linear-gradient(#d5dbe7,#6f7a8e)}
.mn{display:flex;gap:6px;margin-bottom:12%}.mn i{width:7px;height:7px;border-radius:50%;background:#2a3550}
.mh{height:10px;width:72%;border-radius:5px;background:var(--ch);margin-bottom:7px}.mh+.mh{width:46%}
.mp{height:4px;width:60%;background:#3a4663;border-radius:3px;margin-top:12px}
.mb{width:32%;height:13px;border-radius:9px;background:var(--ice);margin-top:14px;box-shadow:0 0 16px var(--ice)}
.mg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:11%}.mg i{height:24px;border:1px solid rgba(76,141,255,.4);border-radius:6px;background:rgba(255,255,255,.04)}
/* orbit divider draws itself */
.orb{display:block;width:100%;max-width:1180px;height:40px;margin:0 auto}
.orb path{fill:none;stroke:url(#og);stroke-width:2;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1.8s ease}.orb.in path{stroke-dashoffset:0}
/* bento services */
.bento{display:grid;gap:14px}
.bento .c:first-child{background:radial-gradient(circle at 100% 100%,rgba(76,141,255,.25),transparent 60%),rgba(255,255,255,.03);justify-content:flex-end;min-height:260px}.bento .c:first-child h3{font-size:clamp(22px,3vw,32px)}
@media(min-width:780px){.bento{grid-template-columns:repeat(4,1fr)}.bento .c:first-child{grid-column:span 2;grid-row:span 2}.bento .c:nth-child(2){grid-column:span 2}}
/* portfolio: horizontal scroll */
.hs{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 18px 22px;scrollbar-width:thin}
.hs .c{flex:0 0 min(84vw,440px);scroll-snap-align:center;padding:26px 26px 22px}
.lap{position:relative;aspect-ratio:16/10;border:5px solid #1a2132;border-bottom-width:9px;border-radius:10px 10px 3px 3px;background:linear-gradient(135deg,var(--a),#0a0f1c 72%);margin:0 14px 16px 0;box-shadow:0 0 40px -10px var(--a)}
html[dir=rtl] .lap{margin:0 0 16px 14px}
.lap::before{content:"";position:absolute;inset:14% 40% 40% 8%;background:linear-gradient(#fff,#fff) 0 0/70% 7px no-repeat,linear-gradient(rgba(255,255,255,.5),rgba(255,255,255,.5)) 0 20px/100% 4px no-repeat,linear-gradient(rgba(255,255,255,.35),rgba(255,255,255,.35)) 0 32px/85% 4px no-repeat}
.ph{position:absolute;inset-inline-end:-16px;bottom:-18px;width:25%;aspect-ratio:9/18;border:4px solid #1a2132;border-radius:12px;background:linear-gradient(160deg,var(--a),#0a0f1c)}
/* featured pricing */
.pk3{display:grid;gap:16px}
@media(min-width:900px){.pk3{grid-template-columns:1fr 1.3fr 1fr;align-items:stretch}}
.pk{padding:28px}.pk .b{margin-top:auto}.pk .pr{margin:6px 0}
.ft{border-color:rgba(160,200,255,.7);box-shadow:0 0 60px -14px var(--ice);padding:34px 30px;background:linear-gradient(160deg,rgba(76,141,255,.16),rgba(255,255,255,.02))}.ft h3{font-size:24px}.ft .pr b{font-size:34px}
@media(max-width:899px){.ft{order:-1}}
.add{margin-top:16px;flex-direction:row;align-items:center;flex-wrap:wrap;gap:8px 24px;justify-content:space-between}
/* offers, stats, faq */
.of2{display:grid;gap:16px}@media(min-width:900px){.of2{grid-template-columns:1fr 1.6fr}}
.of2 .c:last-child{background:radial-gradient(circle at 0 100%,rgba(76,141,255,.22),transparent 60%),rgba(255,255,255,.03)}.of2 h3{font-size:22px}
s{color:var(--mu)}
.rv{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.ab{display:grid;gap:40px}@media(min-width:900px){.ab{grid-template-columns:1fr 1.2fr;align-items:center}}
.stt{display:grid;grid-template-columns:1fr 1fr;gap:28px 18px}
.stt strong{display:block;font:700 clamp(38px,6vw,60px)/1 Unbounded,Cairo}html[lang=ar] .stt strong{font-family:Cairo}
.fq{display:grid;gap:36px}@media(min-width:900px){.fq{grid-template-columns:1fr 1.5fr}}
#faqs{display:grid;gap:10px}
details.c{padding:0;gap:0;border-radius:14px}summary{cursor:pointer;padding:18px 22px;font-weight:600;list-style:none}summary::-webkit-details-marker{display:none}summary::after{content:"+";float:inline-end;color:var(--ice)}details[open] summary::after{content:"–"}details p{padding:0 22px 20px;color:var(--mu)}
.cta{padding:48px 28px;background:radial-gradient(circle at 100% 0,rgba(76,141,255,.28),transparent 55%),rgba(255,255,255,.03);align-items:flex-start;border-radius:28px}
.cta h2{margin-bottom:0}
.ct{display:grid;gap:18px}@media(min-width:900px){.ct{grid-template-columns:1.4fr 1fr}}
input,select,textarea{width:100%;background:#0a0f1c;border:1px solid var(--bd);border-radius:12px;color:var(--tx);padding:13px;font:inherit;margin-bottom:10px}
.soc{display:flex;gap:10px}.soc a{width:42px;height:42px;border:1px solid var(--bd);border-radius:50%;display:grid;place-items:center;transition:transform .25s}.soc a:hover{transform:translateY(-3px)}
.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
footer{border-top:1px solid rgba(255,255,255,.08);padding:44px 18px 110px;max-width:1180px;margin:auto;display:grid;gap:22px;color:var(--mu)}
@media(min-width:900px){footer{grid-template-columns:1fr auto auto;align-items:center}}
footer .links{display:flex;gap:22px;flex-wrap:wrap}footer p{grid-column:1/-1}
.wa{position:fixed;bottom:18px;inset-inline-end:18px;z-index:60;width:58px;height:58px;border-radius:50%;background:#25D366;display:grid;place-items:center;animation:pu 2.4s infinite}
.wa .i{width:30px;height:30px;stroke:#fff;stroke-width:1.9}
@keyframes pu{0%{box-shadow:0 0 0 0 rgba(37,211,102,.55)}70%,100%{box-shadow:0 0 0 18px rgba(37,211,102,0)}}
.reveal{opacity:0;transform:translateY(20px);transition:opacity .7s,transform .7s}.reveal.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){*,::before,::after{animation:none!important;transition:none!important}.reveal{opacity:1;transform:none}.orb path{stroke-dashoffset:0}}
</style>
